{% extends "base.html" %}

{% block title %} - 오류{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card mt-5 text-center">
            <div class="card-body py-5">
                <h1 class="display-1 text-danger mb-4">{{ error_code }}</h1>
                <h4 class="mb-4">{{ error_message }}</h4>
                <p class="text-muted mb-4">죄송합니다. 요청하신 페이지를 찾을 수 없거나 오류가 발생했습니다.</p>
                <a href="{{ url_for('index') }}" class="btn btn-primary">
                    <i class="bi bi-house-door me-2"></i>홈으로 돌아가기
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
