{% extends "base.html" %}

{% block title %} - 문서 검색{% endblock %}

{% block content %}
<!-- 검색 인터페이스 -->
<div class="bg-white rounded-lg shadow-sm border border-gray-200 mb-6">
    <div class="bg-primary-600 text-white px-6 py-4 rounded-t-lg">
        <h2 class="text-xl font-semibold flex items-center">
            <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            문서 검색
        </h2>
    </div>
    <div class="p-6">
        <form id="searchForm" class="space-y-6">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- 검색어 섹션 -->
                <div class="lg:col-span-2 space-y-4">
                    <div id="searchPatterns">
                        <div class="space-y-2">
                            <label class="block text-sm font-medium text-gray-700">검색어</label>
                            <div class="flex space-x-2">
                                <input type="text" class="flex-1 px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent" name="patterns[]" placeholder="검색할 단어나 문장을 입력하세요" required>
                                <button type="button" class="inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500" id="addPattern">
                                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                                    </svg>
                                    추가
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 검색 옵션 -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="flex items-center">
                            <input type="checkbox" id="caseSensitive" name="options[caseSensitive]" class="h-4 w-4 text-primary-600 focus:ring-primary-500 border-gray-300 rounded">
                            <label for="caseSensitive" class="ml-2 block text-sm text-gray-900">대소문자 구분</label>
                        </div>
                        <div class="flex items-center">
                            <input type="checkbox" id="wholeWord" name="options[wholeWord]" class="h-4 w-4 text-primary-600 focus:ring-primary-500 border-gray-300 rounded">
                            <label for="wholeWord" class="ml-2 block text-sm text-gray-900">단어 단위 일치</label>
                        </div>
                        <div class="flex items-center">
                            <input type="checkbox" id="regex" name="options[regex]" class="h-4 w-4 text-primary-600 focus:ring-primary-500 border-gray-300 rounded">
                            <label for="regex" class="ml-2 block text-sm text-gray-900">정규식 사용</label>
                        </div>
                    </div>
                </div>
                
                <!-- 필터 섹션 -->
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">문서 유형</label>
                        <select class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent" name="scope[fileType]" multiple size="4">
                            <option value="pdf" selected class="py-1">PDF</option>
                            <option value="docx" selected class="py-1">Word (DOCX)</option>
                            <option value="xlsx" selected class="py-1">Excel (XLSX)</option>
                            <option value="txt" selected class="py-1">텍스트 (TXT)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">날짜 범위</label>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="date" class="px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent" name="scope[dateFrom]">
                            <input type="date" class="px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent" name="scope[dateTo]">
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="flex flex-col sm:flex-row gap-3 sm:justify-end">
                <button type="reset" class="inline-flex items-center justify-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500">
                    초기화
                </button>
                <button type="submit" class="inline-flex items-center justify-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    검색 실행
                </button>
            </div>
        </form>
    </div>
</div>
        
<!-- 검색 결과 -->
<div class="bg-white rounded-lg shadow-sm border border-gray-200 hidden" id="resultsCard">
    <div class="bg-gray-50 px-6 py-4 border-b border-gray-200 rounded-t-lg">
        <div class="flex justify-between items-center">
            <h3 class="text-lg font-semibold text-gray-900">검색 결과</h3>
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-primary-100 text-primary-800" id="resultCount">0개 문서</span>
        </div>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-5 min-h-96">
        <div class="lg:col-span-2 border-r border-gray-200">
            <div class="h-96 lg:h-auto lg:max-h-96 overflow-y-auto" id="resultsList">
                <!-- 검색 결과가 여기에 표시됩니다 -->
            </div>
        </div>
        <div class="lg:col-span-3">
            <div class="p-6 h-full" id="documentPreview">
                <div class="flex flex-col items-center justify-center h-full text-center">
                    <svg class="w-16 h-16 text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                    <p class="text-gray-500">왼쪽에서 문서를 선택하세요</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const searchForm = document.getElementById('searchForm');
    const addPatternBtn = document.getElementById('addPattern');
    const searchPatterns = document.getElementById('searchPatterns');
    const resultsCard = document.getElementById('resultsCard');
    const resultsList = document.getElementById('resultsList');
    const resultCount = document.getElementById('resultCount');
    const documentPreview = document.getElementById('documentPreview');
    
    // 검색어 추가 버튼 이벤트
    addPatternBtn.addEventListener('click', function() {
        const patternCount = document.querySelectorAll('input[name="patterns[]"]').length;
        const newPattern = document.createElement('div');
        newPattern.className = 'space-y-2';
        newPattern.innerHTML = `
            <div class="flex space-x-2">
                <input type="text" class="flex-1 px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent" name="patterns[]" placeholder="검색할 단어나 문장을 입력하세요" required>
                <button type="button" class="inline-flex items-center px-4 py-2 border border-red-300 text-sm font-medium rounded-md text-red-700 bg-white hover:bg-red-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 remove-pattern">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path>
                    </svg>
                    제거
                </button>
            </div>
        `;
        searchPatterns.appendChild(newPattern);
        
        // 제거 버튼 이벤트 추가
        newPattern.querySelector('.remove-pattern').addEventListener('click', function() {
            newPattern.remove();
        });
    });
    
    // 검색 폼 제출 이벤트
    searchForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        // 검색 데이터 수집
        const patterns = Array.from(document.querySelectorAll('input[name="patterns[]"]'))
            .map(input => input.value)
            .filter(pattern => pattern.trim() !== '');
            
        if (patterns.length === 0) {
            alert('검색어를 입력해주세요.');
            return;
        }
        
        const options = {
            caseSensitive: document.getElementById('caseSensitive').checked,
            wholeWord: document.getElementById('wholeWord').checked,
            regex: document.getElementById('regex').checked
        };
        
        const fileTypes = Array.from(document.querySelectorAll('select[name="scope[fileType]"] option:checked'))
            .map(option => option.value);
            
        const dateFrom = document.querySelector('input[name="scope[dateFrom]"]').value;
        const dateTo = document.querySelector('input[name="scope[dateTo]"]').value;
        
        const searchData = {
            patterns: patterns,
            options: options,
            scope: {
                fileType: fileTypes,
                dateFrom: dateFrom,
                dateTo: dateTo
            }
        };
        
        // 검색 실행
        executeSearch(searchData);
    });
    
    // 검색 실행 함수
    function executeSearch(searchData) {
        // 로딩 표시
        resultsList.innerHTML = '<div class="flex flex-col items-center justify-center p-8"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary-600"></div><p class="mt-4 text-gray-600">검색 중...</p></div>';
        resultsCard.classList.remove('hidden');
        
        // API 호출
        fetch('/api/search', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(searchData)
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                displayResults(data.data.results);
            } else {
                throw new Error(data.message || '검색 중 오류가 발생했습니다.');
            }
        })
        .catch(error => {
            resultsList.innerHTML = `<div class="bg-red-50 border border-red-200 rounded-md p-4 m-4"><div class="flex"><div class="flex-shrink-0"><svg class="h-5 w-5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"></path></svg></div><div class="ml-3"><p class="text-sm text-red-800">${error.message}</p></div></div></div>`;
        });
    }
    
    // 검색 결과 표시 함수
    function displayResults(results) {
        if (!results || results.length === 0) {
            resultsList.innerHTML = '<div class="flex flex-col items-center justify-center p-8"><svg class="w-16 h-16 text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"></path></svg><p class="text-gray-500">검색 결과가 없습니다.</p></div>';
            resultCount.textContent = '0개 문서';
            return;
        }
        
        resultCount.textContent = `${results.length}개 문서`;
        resultsList.innerHTML = '';
        
        results.forEach((result, index) => {
            const resultItem = document.createElement('a');
            resultItem.href = '#';
            resultItem.className = 'block hover:bg-gray-50 px-4 py-4 border-b border-gray-200 cursor-pointer transition-colors';
            resultItem.innerHTML = `
                <div class="flex justify-between items-start mb-2">
                    <h4 class="text-sm font-medium text-gray-900 truncate">${result.filename}</h4>
                    <span class="text-xs text-gray-500 ml-2 flex-shrink-0">${new Date(result.date).toLocaleDateString()}</span>
                </div>
                <p class="text-sm text-gray-600 mb-1">${result.matches.length}개 일치 항목 발견</p>
                <div class="text-xs text-gray-500">${(result.filetype || 'unknown').toUpperCase()}, ${formatFileSize(result.size)}</div>
            `;
            
            resultItem.addEventListener('click', function(e) {
                e.preventDefault();
                document.querySelectorAll('#resultsList a').forEach(item => {
                    item.classList.remove('bg-primary-50', 'border-primary-200');
                    item.classList.add('hover:bg-gray-50');
                });
                this.classList.remove('hover:bg-gray-50');
                this.classList.add('bg-primary-50', 'border-primary-200');
                displayDocumentPreview(result);
            });
            
            resultsList.appendChild(resultItem);
        });
        
        // 첫 번째 결과 자동 선택
        if (results.length > 0) {
            const firstItem = resultsList.querySelector('a');
            firstItem.classList.remove('hover:bg-gray-50');
            firstItem.classList.add('bg-primary-50', 'border-primary-200');
            displayDocumentPreview(results[0]);
        }
    }
    
    // 문서 미리보기 표시 함수
    function displayDocumentPreview(document) {
        documentPreview.innerHTML = `
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-semibold text-gray-900 truncate">${document.filename}</h3>
                <a href="/view/document/${document.id}" class="inline-flex items-center px-3 py-1 border border-primary-300 text-sm font-medium rounded-md text-primary-700 bg-primary-50 hover:bg-primary-100 transition-colors" target="_blank">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                    </svg>
                    전체 보기
                </a>
            </div>
            <div class="bg-white border border-gray-200 rounded-lg shadow-sm mb-4">
                <div class="bg-gray-50 px-4 py-3 border-b border-gray-200 rounded-t-lg">
                    <div class="flex items-center text-sm text-gray-600">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        ${(document.filetype || 'unknown').toUpperCase()} 파일, ${formatFileSize(document.size)}, 
                        업로드: ${new Date(document.date).toLocaleString()}
                    </div>
                </div>
                <div class="p-4 max-h-64 overflow-y-auto">
                    <div class="space-y-4">
                        ${document.matches.map((match, idx) => `
                            <div class="border-l-4 border-primary-500 pl-4 py-2">
                                <div class="text-sm text-gray-500 mb-2">일치 항목 #${idx + 1}</div>
                                <div class="bg-gray-50 p-3 rounded-md">
                                    <pre class="text-sm whitespace-pre-wrap font-mono">${match.context_before}<mark class="bg-yellow-200 px-1 rounded">${match.text}</mark>${match.context_after}</pre>
                                </div>
                                <div class="text-xs text-gray-500 mt-2">
                                    페이지 ${match.page || 'N/A'}, 위치: ${match.position || 'N/A'}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            </div>
        `;
    }
    
    // 파일 크기 포맷 함수
    function formatFileSize(bytes) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }
});
</script>
{% endblock %}
